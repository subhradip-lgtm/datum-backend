# Fly.io config — deploy with:
#   flyctl launch --no-deploy   (creates the app, skip its auto-generated config)
#   flyctl postgres create --name datum-db --region bom
#   flyctl postgres attach datum-db                # wires DATABASE_URL as a secret
#   flyctl secrets set JWT_SECRET=... REFRESH_TOKEN_SECRET=... RAZORPAY_KEY_ID=... RAZORPAY_KEY_SECRET=... RAZORPAY_WEBHOOK_SECRET=...
#   flyctl volumes create datum_storage --size 5 --region bom
#   flyctl deploy

app = "datum-backend"
primary_region = "bom"   # Mumbai — closest Fly region to Kolkata/Delhi

[build]

[env]
  PORT = "4000"
  NODE_ENV = "production"
  STORAGE_DIR = "/app/storage"
  FILE_STORAGE_DRIVER = "local"
  PDF_PREVIEW_DPI = "120"

[[mounts]]
  source = "datum_storage"
  destination = "/app/storage"

[[services]]
  internal_port = 4000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    grace_period = "10s"
    method = "get"
    path = "/health"
    protocol = "http"
    timeout = "5s"
